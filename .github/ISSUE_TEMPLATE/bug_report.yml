name: Bug report
description: Visual glitch, crash, audio issue, or anything that doesn't behave as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening: search existing issues for your GPU/error first, it may already be tracked.

  - type: input
    id: version
    attributes:
      label: Port release
      description: The name of the release you downloaded, or the commit if you built it yourself
      placeholder: Alpha 1
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux (AppImage)
        - Windows 10/11 (.zip)
        - Windows package under Wine/Proton
        - Built from source
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 24H2, Fedora 44 (KDE, Wayland)"
    validations:
      required: true

  - type: input
    id: gpu
    attributes:
      label: GPU and driver version
      placeholder: "RX 6600, Adrenalin 26.8.1"
    validations:
      required: true

  - type: input
    id: cpu
    attributes:
      label: CPU
      placeholder: "Ryzen 7 5700X"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you expected vs what actually happened
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: last_run.log
      description: "Attach the file (drag and drop it here). The port writes it on every start: next to Project Blue Moon.exe in `user\\` on Windows, in `~/.local/share/tsuki/user/` with the AppImage, or in the Saves folder chosen in the launcher. Required for crashes, black screens, graphics glitches and performance issues."
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or video
      description: Especially for visual glitches. Say which scene it is (chapter, the line of text on screen).
    validations:
      required: false
