name: Game won't launch / crashes on startup
description: Black screen, instant close, "prepare failed", param.sfo errors, etc.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Most launch failures come from an incomplete or misplaced game dump (missing `param.sfo`,
        another game or version, wrong folder selected). The port runs TSUKIHIME -A piece of blue
        glass moon- CUSA47999, version 01.00 only. Check the README's setup section before filing:
        https://github.com/OWNER/REPO#download-and-play

  - type: input
    id: version
    attributes:
      label: Port release
      description: The name of the release you downloaded, or the commit if you built it yourself
      placeholder: Alpha 1
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Linux (AppImage)
        - Windows 10/11 (.zip)
        - Windows package under Wine/Proton
        - Built from source
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11 24H2, Fedora 44 (KDE, Wayland)"
    validations:
      required: true

  - type: input
    id: game_version
    attributes:
      label: Game serial and version
      description: "As the launcher shows them under the cover, e.g. CUSA47999 · version 01.00"
    validations:
      required: true

  - type: textarea
    id: folder
    attributes:
      label: Selected game folder
      description: Screenshot of the folder you pointed the launcher at, showing eboot.bin, sce_sys and sce_module.
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: Exact error message
      description: Copy the full text shown by the launcher or the game window, don't paraphrase it.
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: last_run.log
      description: "Attach the file. The port writes it on every start: next to Project Blue Moon.exe in `user\\` on Windows, in `~/.local/share/tsuki/user/` with the AppImage, or in the Saves folder chosen in the launcher."
    validations:
      required: true
